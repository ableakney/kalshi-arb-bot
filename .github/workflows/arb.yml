
name: Kalshi arb check

on:
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      send_test:
        description: 'Type 1 to send a test alert'
        required: false
        default: '0'
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST: ${{ github.event.inputs.send_test || '0' }}
        run: python arb_bot.py
